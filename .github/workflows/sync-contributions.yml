name: Sync contribution ledger

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_contributions.py"
      - "data/contribution_metadata.json"
      - "tests/**"
      - ".github/workflows/sync-contributions.yml"

permissions:
  contents: write

concurrency:
  group: sync-contribution-ledger
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m py_compile scripts/sync_contributions.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate live contribution ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_TO_TRACK: Johnny-Kao
        run: python scripts/sync_contributions.py

      - name: Commit ledger changes
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- CONTRIBUTIONS.md README.md data/contribution_registry.json data/enrichment_queue.json)" ]; then
            echo "Contribution ledger is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTIONS.md README.md data/contribution_registry.json data/enrichment_queue.json
          git commit -m "chore: sync contribution ledger"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish after 3 attempts" >&2
          exit 1
